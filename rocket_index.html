<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ракета — демо</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --soft: #f4f8fd;
    --card: #ffffff;
    --border: #dfe8f5;
    --navy: #0a1a4a;
    --blue: #2f7bff;
    --sky: #7fd0ff;
    --text: #0a1a4a;
    --muted: #6b7a99;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Inter", system-ui, sans-serif;
    color: var(--text);
    min-height: 100vh;
    padding: 20px 16px;
    display: flex;
    justify-content: center;
    background: linear-gradient(180deg, #03060f 0%, #070d22 100%);
  }
  .wrap { width: 100%; max-width: 940px; display: flex; flex-direction: column; gap: 16px; }

  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 4px;
  }
  .logo {
    font-family: "Orbitron", sans-serif; font-weight: 800; font-size: 22px;
    letter-spacing: 3px; color: #ffffff;
  }
  .balance {
    display: flex; align-items: center; gap: 10px;
    background: var(--card); border: 1px solid var(--border);
    padding: 8px 16px; border-radius: 999px;
    font-size: 13px; color: var(--muted);
  }
  .balance b {
    font-family: "Orbitron", sans-serif; font-weight: 600;
    color: var(--navy); font-size: 15px; font-variant-numeric: tabular-nums;
  }

  .history { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none; }
  .history::-webkit-scrollbar { display: none; }
  .chip {
    font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 999px;
    white-space: nowrap; font-variant-numeric: tabular-nums;
    border: 1px solid var(--border); background: var(--card); color: var(--navy);
  }
  .chip.red { color: #e53935; border-color: rgba(229,57,53,.35); }
  .chip.yellow { color: #d68a00; border-color: rgba(214,138,0,.4); }
  .chip.green { color: #2e9e5b; border-color: rgba(46,158,91,.4); }

  .stage {
    position: relative; height: 380px; border-radius: 24px; overflow: hidden;
    border: 1px solid var(--border);
    background: linear-gradient(180deg, #03060f 0%, #070d22 100%);
  }
  canvas { width: 100%; height: 100%; display: block; }

  .readout {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none;
  }
  #mult {
    font-family: "Orbitron", sans-serif; font-weight: 800;
    font-size: clamp(40px, 8.5vw, 80px);
    transform: translateY(-36px);
    font-variant-numeric: tabular-nums;
    color: #ffffff;
    transition: color .2s;
  }
  #mult.crashed { color: var(--sky); }
  #status {
    margin-top: 10px; font-size: 14px; color: #ffffff;
    padding: 6px 14px; border-radius: 999px;
    background: rgba(255,255,255,.12);
  }
  #status.crashed { color: var(--sky); }
  #status.win { color: #ffffff; }

  .panel {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 24px; padding: 18px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
  }
  .field { display: flex; flex-direction: column; gap: 8px; }
  .field-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted);
  }
  .input-wrap {
    position: relative; display: flex; align-items: center;
    background: var(--soft); border: 1px solid var(--border);
    border-radius: 14px; transition: border-color .2s;
  }
  .input-wrap:focus-within { border-color: var(--blue); }
  .input-wrap input {
    width: 100%; background: transparent; border: none; outline: none;
    color: var(--navy); font: 600 18px "Inter", sans-serif; padding: 14px 16px;
    font-variant-numeric: tabular-nums; -moz-appearance: textfield;
  }
  .input-wrap input::-webkit-outer-spin-button,
  .input-wrap input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .input-wrap .suffix { padding-right: 16px; color: var(--muted); font-size: 14px; }

  .quick { display: flex; gap: 6px; }
  .quick button {
    flex: 1; background: #ffffff; color: var(--navy);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 6px; cursor: pointer; font: 500 12px "Inter", sans-serif;
    transition: background .15s, border-color .15s;
  }
  .quick button:hover { background: var(--soft); border-color: var(--blue); }

  .toggle { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); cursor: pointer; user-select: none; }
  .toggle input { appearance: none; width: 36px; height: 20px; border-radius: 999px;
    background: #d6e0f0; position: relative; cursor: pointer; transition: background .2s; }
  .toggle input::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
    border-radius: 50%; background: #fff; transition: transform .2s;
  }
  .toggle input:checked { background: var(--blue); }
  .toggle input:checked::after { transform: translateX(16px); }

  .actions { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .action {
    border: none; border-radius: 16px; padding: 18px;
    font: 700 16px "Orbitron", sans-serif; letter-spacing: 1.5px; color: #ffffff;
    cursor: pointer; transition: transform .1s, opacity .2s, filter .2s;
  }
  .action:hover:not(:disabled) { filter: brightness(1.08); }
  .action:active:not(:disabled) { transform: scale(.98); }
  .action:disabled { opacity: .35; cursor: not-allowed; }
  #betBtn { background: var(--navy); }
  #cashBtn { background: var(--blue); }
  .hint { grid-column: 1 / -1; font-size: 12px; color: var(--muted); text-align: center; }
  /* адаптация под телефон */
  @media (max-width: 640px) {
    body { padding: 12px 10px; }
    .wrap { gap: 12px; }
    .logo { font-size: 18px; letter-spacing: 2px; }
    .balance { font-size: 12px; padding: 6px 12px; }
    .balance b { font-size: 13px; }
    .stage { height: 300px; border-radius: 18px; }
    #mult { transform: translateY(-20px); }
    #status { font-size: 12px; padding: 5px 10px; text-align: center; max-width: 92%; }
    .panel { grid-template-columns: 1fr; padding: 14px; border-radius: 18px; }
    .actions { grid-template-columns: 1fr; }
    .action { padding: 16px; font-size: 14px; }
    .input-wrap input { font-size: 16px; padding: 12px 14px; }
    .quick button { padding: 10px 4px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">РАКЕТА</div>
    <div class="balance">Баланс <b id="balance">1000.00</b></div>
  </header>

  <div class="history" id="history"></div>

  <div class="stage">
    <canvas id="canvas"></canvas>
    <div class="readout">
      <div id="mult">1.00x</div>
      <div id="status">Сделайте ставку, чтобы начать раунд</div>
    </div>
  </div>

  <div class="panel">
    <div class="field">
      <span class="field-label">Ставка</span>
      <div class="input-wrap">
        <input type="number" id="bet" min="1" value="10" step="1">
        <span class="suffix">монет</span>
      </div>
      <div class="quick">
        <button data-mult="0.5">½</button>
        <button data-mult="2">×2</button>
        <button data-mult="10">10%</button>
      </div>
    </div>

    <div class="field">
      <span class="field-label">Автовывод</span>
      <div class="input-wrap">
        <input type="number" id="auto" min="1.01" step="0.01" value="2.00">
        <span class="suffix">x</span>
      </div>
      <label class="toggle">
        <input type="checkbox" id="autoOn"> Включить автовывод
      </label>
    </div>

    <div class="actions">
      <button class="action" id="betBtn">СТАВКА</button>
      <button class="action" id="cashBtn" disabled>ЗАБРАТЬ</button>
    </div>

    <div class="hint">Демо на виртуальные монеты. Реальных денег здесь нет.</div>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const multEl = document.getElementById('mult');
  const statusEl = document.getElementById('status');
  const balanceEl = document.getElementById('balance');
  const betInput = document.getElementById('bet');
  const autoInput = document.getElementById('auto');
  const autoOn = document.getElementById('autoOn');
  const betBtn = document.getElementById('betBtn');
  const cashBtn = document.getElementById('cashBtn');
  const historyEl = document.getElementById('history');

  let balance = 1000;
  let state = 'idle';       // waiting | flying | crashed
  let crashAt = 1;
  let mult = 1;
  let startTime = 0;
  let myBet = 0;
  let cashedOut = null;
  let trail = [];
  let history = [];
  let crashT = 0;
  let countdownTimer = null;
  const GROWTH = 0.12;
  const BET_TIME = 5000;    // время на ставки, мс
  const ROCKET_SCALE = 1.2; // размер ракеты
  const START_ANGLE = 15 * Math.PI / 180; // начальный угол траектории

  // Краш с преимуществом дома ~4%
  function genCrash() {
    const r = Math.random();
    const c = 0.96 / (1 - r);
    return Math.max(1.00, Math.floor(c * 100) / 100);
  }

  function resize() {
    const r = canvas.getBoundingClientRect();
    canvas.width = r.width * devicePixelRatio;
    canvas.height = r.height * devicePixelRatio;
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  function fmt(n) { return n.toFixed(2) + 'x'; }
  function setBalance(v) {
    balance = Math.round(v * 100) / 100;
    balanceEl.textContent = balance.toFixed(2);
  }

  // ракета
  function drawRocket(x, y, angle, flame) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.scale(ROCKET_SCALE, ROCKET_SCALE);

    // пламя из сопла (сзади, слева)
    if (flame) {
      const flick = 0.8 + Math.random() * 0.4;
      const layers = [
        { len: 40 * flick, w: 6, c0: 'rgba(47,123,255,.55)', c1: 'rgba(47,123,255,0)' },
        { len: 26 * flick, w: 4, c0: 'rgba(127,208,255,.9)', c1: 'rgba(127,208,255,0)' },
        { len: 13 * flick, w: 2, c0: 'rgba(255,255,255,1)',  c1: 'rgba(127,208,255,0)' },
      ];
      for (const L of layers) {
        const g = ctx.createLinearGradient(-18, 0, -18 - L.len, 0);
        g.addColorStop(0, L.c0);
        g.addColorStop(1, L.c1);
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.moveTo(-16, -L.w);
        ctx.quadraticCurveTo(-18 - L.len * 0.5, -L.w * 0.4, -16 - L.len, 0);
        ctx.quadraticCurveTo(-18 - L.len * 0.5, L.w * 0.4, -16, L.w);
        ctx.closePath();
        ctx.fill();
      }
    }

    // изогнутые плавники (синие с серебристым бликом)
    ctx.fillStyle = '#2f7bff';
    ctx.beginPath();
    ctx.moveTo(-2, -8);
    ctx.quadraticCurveTo(-12, -14, -18, -14);
    ctx.quadraticCurveTo(-16, -9, -10, -4);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-2, 8);
    ctx.quadraticCurveTo(-12, 14, -18, 14);
    ctx.quadraticCurveTo(-16, 9, -10, 4);
    ctx.closePath(); ctx.fill();

    // сопло
    ctx.fillStyle = '#cfe6ff';
    ctx.beginPath(); ctx.ellipse(-16, 0, 2.5, 4.5, 0, 0, Math.PI * 2); ctx.fill();

    // корпус: заострённый нос, объёмный градиент (синий → светлый блик → синий)
    const bodyG = ctx.createLinearGradient(0, -9, 0, 9);
    bodyG.addColorStop(0, '#5c9dff');
    bodyG.addColorStop(0.4, '#cfe6ff');
    bodyG.addColorStop(1, '#1d5ad6');
    ctx.fillStyle = bodyG;
    ctx.beginPath();
    ctx.moveTo(44, 0);
    ctx.bezierCurveTo(36, -7, 22, -10, 8, -9);
    ctx.lineTo(-14, -8);
    ctx.lineTo(-14, 8);
    ctx.lineTo(8, 9);
    ctx.bezierCurveTo(22, 10, 36, 7, 44, 0);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#0a1a4a';
    ctx.lineWidth = 0.8;
    ctx.stroke();

    // серебристые полосы
    const band = ctx.createLinearGradient(0, -9, 0, 9);
    band.addColorStop(0, '#ffffff');
    band.addColorStop(0.5, '#9fb2d4');
    band.addColorStop(1, '#eaf4ff');
    ctx.fillStyle = band;
    ctx.fillRect(-10, -8.6, 3, 17.2);
    ctx.fillRect(-4, -8.9, 2, 17.8);
    ctx.beginPath();
    ctx.moveTo(29, -6.8); ctx.lineTo(31, -8.3); ctx.lineTo(31, 8.3); ctx.lineTo(29, 6.8); ctx.closePath(); ctx.fill();

    // блик сверху
    ctx.fillStyle = 'rgba(255,255,255,.8)';
    ctx.beginPath();
    ctx.ellipse(24, -5, 6, 1.2, -0.1, 0, Math.PI * 2);
    ctx.fill();

    // большой иллюминатор: серебряная рамка, синее стекло, блик
    ctx.fillStyle = '#cfe6ff';
    ctx.beginPath(); ctx.arc(10, 0, 6.6, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#6b7fa6';
    ctx.lineWidth = 0.7;
    ctx.stroke();
    const glassG = ctx.createRadialGradient(9, -1.5, 0.5, 10, 0, 5.2);
    glassG.addColorStop(0, '#9fe3ff');
    glassG.addColorStop(1, '#1d5ad6');
    ctx.fillStyle = glassG;
    ctx.beginPath(); ctx.arc(10, 0, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    ctx.beginPath(); ctx.ellipse(8.2, -2, 1.8, 1, -0.5, 0, Math.PI * 2); ctx.fill();

    ctx.restore();
  }

  // ---- облака на фоне: полупрозрачные, медленно плывут ----
  // 8 моделей облаков, повторяющих силуэты из присланного набора (строится кругами)
  const CLOUD_SHAPES = [
    [[-0.9, 0.1, 0.5], [-0.4, -0.3, 0.7], [0.2, -0.5, 0.8], [0.8, 0.0, 0.6], [-0.6, 0.3, 0.5], [0.3, 0.2, 0.7]],
    [[-1.2, 0.2, 0.6], [-0.6, -0.2, 0.6], [0, -0.3, 0.8], [0.8, -0.2, 0.7], [1.3, 0.2, 0.5], [-0.3, 0.3, 0.6], [0.5, 0.3, 0.6]],
    [[-0.7, 0.2, 0.6], [0.0, -0.3, 0.8], [0.7, -0.5, 0.9], [0.8, 0.3, 0.6], [-0.2, 0.4, 0.5]],
    [[-1.2, 0.2, 0.4], [-0.5, -0.1, 0.6], [0.2, -0.2, 0.7], [0.9, -0.1, 0.6], [1.5, 0.2, 0.4], [0.0, 0.3, 0.5]],
    [[-0.9, 0.1, 0.6], [-0.3, -0.2, 0.8], [0.4, -0.1, 0.8], [1.0, 0.2, 0.5], [-0.5, 0.4, 0.5], [0.2, 0.4, 0.6]],
    [[-1.0, 0.2, 0.5], [-0.4, -0.2, 0.7], [0.2, -0.4, 0.6], [0.8, -0.1, 0.7], [1.4, 0.2, 0.4], [-0.1, 0.3, 0.6]],
    [[-1.0, 0.2, 0.5], [-0.4, -0.1, 0.7], [0.2, -0.3, 0.8], [0.9, -0.1, 0.8], [1.5, 0.2, 0.4], [0.6, 0.3, 0.5]],
    [[-0.9, 0.2, 0.6], [-0.3, -0.2, 0.7], [0.4, -0.2, 0.7], [1.0, 0.0, 0.6], [0.2, 0.3, 0.6]],
  ];
  // по одному облаку каждой из 8 моделей
  const clouds = CLOUD_SHAPES.map((_, i) => ({
    t: i,
    fx: Math.random(),
    fy: 0.55 + Math.random() * 0.45,
    s: 0.6 + Math.random() * 0.9,
    v: 0.015 + Math.random() * 0.03,
  }));

  function drawClouds(w, h, dt) {
    const speedMul = state === 'flying' ? 3 : 1;
    for (const c of clouds) {
      c.fx -= c.v * speedMul * dt;
      if (c.fx < -0.2) { c.fx = 1.2; c.fy = 0.55 + Math.random() * 0.45; }
      const cx = c.fx * w, cy = c.fy * h, r = 23.4 * c.s;
      // 8 моделей облаков: набор кругов [dx, dy, радиус] в долях базового размера
      ctx.fillStyle = 'rgba(70,90,170,0.28)';
      ctx.beginPath();
      for (const [dx, dy, rr] of CLOUD_SHAPES[c.t]) {
        ctx.moveTo(cx + (dx + rr) * r, cy + dy * r);
        ctx.arc(cx + dx * r, cy + dy * r, rr * r, 0, Math.PI * 2);
      }
      ctx.fill();
    }
  }

  // ---- искры ----
  const sparks = [];
  let flash = 0;
  let lastFrame = performance.now();

  function spawnSpark(x, y, big, base = 2.64) {
    const a = big ? Math.random() * Math.PI * 2 : base + (Math.random() - 0.5) * 1.1;
    const sp = big ? 140 + Math.random() * 360 : 60 + Math.random() * 120;
    sparks.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      life: 0,
      max: big ? 1.2 + Math.random() * 1.4 : 0.35 + Math.random() * 0.45,
      size: big ? 3 + Math.random() * 5 : 1 + Math.random() * 1.6,
      color: big
        ? (Math.random() < 0.5 ? '#7fd0ff' : '#ffffff')
        : (Math.random() < 0.5 ? '#2f7bff' : '#7fd0ff'),
      big,
    });
  }

  function burst(x, y) {
    for (let i = 0; i < 40; i++) spawnSpark(x, y, true);
    flash = 0.2;
  }

  function updateSparks(dt) {
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.life += dt;
      if (s.life >= s.max) { sparks.splice(i, 1); continue; }
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.vy += (s.big ? 220 : 120) * dt;   // гравитация
      const damp = Math.pow(0.4, dt);
      s.vx *= damp;
      s.vy *= damp;

      const t = 1 - s.life / s.max;
      ctx.globalAlpha = t;
      ctx.fillStyle = s.color;
      ctx.beginPath();
      ctx.arc(s.x, s.y, Math.max(0.5, s.size * t), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawExplosion(x, y, t) {
    const colors = ['#ffffff', '#2f7bff', '#7fd0ff'];
    for (let i = 0; i < 18; i++) {
      const a = (i / 18) * Math.PI * 2;
      const d = t * (60 + (i % 3) * 25);
      ctx.fillStyle = colors[i % 3];
      ctx.globalAlpha = 1 - t;
      ctx.beginPath();
      ctx.arc(x + Math.cos(a) * d, y + Math.sin(a) * d, 5 * (1 - t) + 1.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function draw() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    const now = performance.now();
    const dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;
    ctx.clearRect(0, 0, w, h);

    if (flash > 0.001) {
      ctx.fillStyle = `rgba(255,255,255,${flash})`;
      ctx.fillRect(0, 0, w, h);
      flash *= Math.pow(0.02, dt);
    }

    // звёзды (параллакс)
    const speed = state === 'flying' ? 1.6 : 0.3;
    for (let i = 0; i < 60; i++) {
      const sx = (i * 137.5) % w;
      const depth = (i % 3) + 1;
      const sy = (i * 61.3 + performance.now() / (60 / depth) * speed) % h;
      ctx.fillStyle = `rgba(255,255,255,${0.15 + depth * 0.15})`;
      ctx.fillRect(sx, sy, depth * 0.8, depth * 0.8);
    }

    drawClouds(w, h, dt);

    // траектория: кубическая кривая Безье, старт под 15°, в конце почти вертикально
    const X = w * 0.42, Yh = h * 0.8;
    const P1x = 0.4 * X, P1y = 0.4 * X * Math.tan(START_ANGLE);
    const P2x = 0.9 * X, P2y = 0.45 * Yh;
    const P3x = X,       P3y = Yh;
    const t = progress(), u = 1 - t;
    const bx = 3 * u * u * t * P1x + 3 * u * t * t * P2x + t * t * t * P3x;
    const by = 3 * u * u * t * P1y + 3 * u * t * t * P2y + t * t * t * P3y;
    const dx = 3 * u * u * P1x + 6 * u * t * (P2x - P1x) + 3 * t * t * (P3x - P2x);
    const dy = 3 * u * u * P1y + 6 * u * t * (P2y - P1y) + 3 * t * t * (P3y - P2y);
    const px = w * 0.12 + bx;
    const py = h * 0.85 - by;
    // ракета смотрит по касательной к траектории
    const angle = Math.atan2(-dy, dx);
    // камера: после ~7x ракета упирается в верх, а картинка поднимается вниз
    const camY = Math.max(0, mult - 7) * 14;
    // ракета рисуется внутри поля, чтобы нос не выходил за границы
    const rx = Math.min(w - 60, Math.max(60, px));
    const ry = Math.min(h - 60, Math.max(60, py));

    if (state === 'flying' || state === 'crashed') {
      // след начинается у хвоста ракеты, так что всегда остаётся позади
      trail.push({
        x: rx - Math.cos(angle) * 18 * ROCKET_SCALE,
        y: ry - Math.sin(angle) * 18 * ROCKET_SCALE - camY,
      });
      if (trail.length > 400) trail.shift();
    }

    // белая полоса следа всегда видна: все прошлые полёты + текущий
    const allPaths = trail.length > 1 ? [trail] : [];
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (const path of allPaths) {
      if (path.length < 2) continue;
      ctx.strokeStyle = '#ffffff';
      ctx.globalAlpha = 0.3;
      ctx.lineWidth = 8;
      ctx.beginPath();
      path.forEach((p, i) => i ? ctx.lineTo(p.x, p.y + camY) : ctx.moveTo(p.x, p.y + camY));
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.lineWidth = 3;
      ctx.beginPath();
      path.forEach((p, i) => i ? ctx.lineTo(p.x, p.y + camY) : ctx.moveTo(p.x, p.y + camY));
      ctx.stroke();
    }

    // искры из сопла при полёте
    if (state === 'flying') {
      const tx = rx - Math.cos(angle) * 18 * ROCKET_SCALE;
      const ty = ry - Math.sin(angle) * 18 * ROCKET_SCALE;
      for (let i = 0; i < 2; i++) spawnSpark(tx, ty, false, angle + Math.PI);
    }

    updateSparks(dt);

    if (state === 'crashed' && crashT === 0) burst(px, py);
    if (state === 'crashed') {
      crashT = Math.min(1, crashT + 0.035);
      drawExplosion(px, py, crashT);
    } else if (state === 'flying') {
      drawRocket(rx, ry, angle, true);
    } else {
      drawRocket(w * 0.12, h * 0.85, -START_ANGLE, false);
    }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  // прогресс полёта (0..1) от текущего множителя
  function progress() { return Math.min(1, (mult - 1) / 6); }

  function renderHistory() {
    historyEl.innerHTML = history.map(x => {
      const cls = x < 2 ? 'red' : x < 5 ? 'yellow' : 'green';
      return `<span class="chip ${cls}">${fmt(x)}</span>`;
    }).join('');
  }

  function setStatus(text, cls = '') {
    statusEl.textContent = text;
    statusEl.className = cls;
  }

  // ---- состояние приходит с сервера (Flask): раунды, ставки и баланс считает сервер ----
  let roundId = -1;
  let autoSent = false;
  let polling = false;

  async function api(path, body) {
    const opts = body === undefined
      ? {}
      : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) };
    const res = await fetch(path, opts);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Ошибка');
    return data;
  }

  function applyState(s) {
    balance = s.balance;
    balanceEl.textContent = s.balance.toFixed(2);
    myBet = s.bet;

    if (s.round_id !== roundId) {          // начался новый раунд: очищаем след и взрыв
      roundId = s.round_id;
      trail = [];
      crashT = 0;
      autoSent = false;
    }

    state = s.phase;
    mult = s.multiplier;
    multEl.textContent = fmt(mult);
    multEl.className = s.phase === 'crashed' ? 'crashed' : '';

    betBtn.disabled = s.phase !== 'waiting' || s.bet > 0;
    cashBtn.disabled = !(s.phase === 'flying' && s.bet > 0 && s.cashed_out === null);

    if (s.history.length !== history.length || s.history[0] !== history[0]) {
      history = s.history.slice();
      renderHistory();
    }

    if (s.phase === 'waiting') {
      setStatus(`Ставки: ${s.bet_left.toFixed(1)} сек` + (s.bet > 0 ? ` · ваша ставка ${s.bet} в игре` : ''));
    } else if (s.phase === 'flying') {
      if (s.cashed_out !== null) setStatus(`Забрано на ${fmt(s.cashed_out)}`, 'win');
      else if (s.bet > 0) setStatus('Ракета летит! Забирайте, пока не взорвалась');
      else setStatus('Ракета летит');
    } else {
      if (s.cashed_out !== null) setStatus(`Взрыв на ${fmt(s.crash_at)} · вы забрали на ${fmt(s.cashed_out)}`, 'win');
      else if (s.bet > 0) setStatus(`Взрыв на ${fmt(s.crash_at)} — ставка ${s.bet} сгорела`, 'crashed');
      else setStatus(`Взрыв на ${fmt(s.crash_at)}`, 'crashed');
    }

    // автовывод: отправляем команду, а проверку момента делает сервер
    if (s.phase === 'flying' && s.bet > 0 && s.cashed_out === null && autoOn.checked
        && !autoSent && s.multiplier >= parseFloat(autoInput.value)) {
      autoSent = true;
      cashOut();
    }
  }

  async function poll() {
    if (polling) return;
    polling = true;
    try {
      applyState(await api('/api/state'));
    } catch (e) {
      setStatus('Нет связи с сервером', 'crashed');
    } finally {
      polling = false;
    }
  }

  async function placeBet() {
    const amount = parseFloat(betInput.value);
    try {
      applyState(await api('/api/bet', { amount }));
    } catch (e) {
      setStatus(e.message, 'crashed');
    }
  }

  async function cashOut() {
    try {
      applyState(await api('/api/cashout', {}));
    } catch (e) {
      setStatus(e.message, 'crashed');
    }
  }

  betBtn.addEventListener('click', placeBet);
  cashBtn.addEventListener('click', cashOut);

  document.querySelectorAll('.quick button').forEach(btn => {
    btn.addEventListener('click', () => {
      const m = btn.dataset.mult;
      if (m === '10') betInput.value = Math.max(1, Math.floor(balance * 0.1));
      else betInput.value = Math.max(1, Math.floor(parseFloat(betInput.value) * parseFloat(m)));
    });
  });

  poll();
  setInterval(poll, 100);
})();
</script>
</body>
</html>
