<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Шрифт Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- Подключение файла стилей с защитой от кэширования -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}?v=2">

    <title>{% block title %}Burmalda{% endblock %}</title>
    {% block head %}{% endblock %}
</head>
<body class="site-body">
    <div class="layout-container">

        <!-- ЖЁЛТЫЙ БОКОВОЙ БАР -->
        <aside class="sidebar-yellow">
            <!-- Верх: Логотип -->
            <div class="sidebar-top">
                <a href="{{ url_for('main_page') }}" class="sidebar-logo">
                    <img src="{{ url_for('static', filename='image/logo.png') }}" alt="logo" class="logo-image">
                </a>
            </div>

            <!-- Центр: Кнопки строго в столбец (по одной в ряду) -->
            <nav class="sidebar-menu">
                <a href="{{ url_for('main_page') }}" class="menu-btn">Главная</a>
                <a href="{{ url_for('rocket') }}" class="menu-btn">Ракетка</a>
                <a href="{{ url_for('slots') }}" class="menu-btn">Слоты</a>
                <a href="{{ url_for('zachet.index') }}" class="menu-btn">Апгрейдер</a>
                <a href="{{ url_for('double.index') }}" class="menu-btn">Double</a>
                <a href="{{ url_for('vorona_combat') }}" class="menu-btn">Ворона КОМБАТ</a>
            </nav>

            <!-- Низ: Блок пользователя -->
            <div class="sidebar-bottom">
                {% if current_user %}
                    <div class="user-block">
                        <a href="{{ url_for('profile') }}" class="user-email" title="{{ current_user }}">{{ current_user }}</a>
                        <a href="{{ url_for('logout') }}" class="logout-link">Выйти</a>
                    </div>
                {% else %}
                    <div class="guest-block">
                        <a href="{{ url_for('login') }}" class="auth-btn login-btn">Войти</a>
                        <a href="{{ url_for('register') }}" class="auth-btn reg-btn">Регистрация</a>
                    </div>
                {% endif %}
            </div>
        </aside>

        <!-- ОСНОВНАЯ ОБЛАСТЬ (СПРАВА) -->
        <div class="content-wrapper">
            <!-- Баланс в правом верхнем углу без рамок -->
            {% if current_user %}
            <div class="header-balance-plain">
                <span id="header-balance">{{ current_balance }}</span> 🪙
            </div>
            {% endif %}

            <!-- Контент страницы -->
            <main class="page-body">
                {% block body %}{% endblock %}
            </main>
        </div>

    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    {% block scripts %}{% endblock %}
</body>
</html>
