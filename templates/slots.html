<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>BURMALDA SLOTS</title>
    <style>
        body {
            background-color: #0f1115;
            color: #e4e6eb;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .navbar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #161920;
            border-bottom: 1px solid #232835;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            box-sizing: border-box;
            height: 70px;
            z-index: 1000;
        }
        .navbar-left {
            display: flex;
            align-items: center;
            gap: 30px;
        }
        .navbar-logo {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #d4af37;
            text-transform: uppercase;
        }
        .navbar-menu {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
            gap: 10px;
        }
        .navbar-item a {
            color: #9aa0a6;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 10px 15px;
            border-radius: 6px;
            transition: all 0.2s ease;
        }
        .navbar-item a:hover {
            color: #ffffff;
            background-color: #232835;
        }
        .navbar-item a.active {
            color: #d4af37;
            background-color: #1f2430;
        }
        .navbar-balance {
            font-size: 1.1rem;
            color: #9aa0a6;
            font-weight: 600;
        }
        #balance-display {
            color: #ffffff;
            font-weight: 700;
        }
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 70px;
        }
        .slot-machine {
            background-color: #161920;
            border: 1px solid #232835;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .reels-container {
            display: flex;
            gap: 20px;
            background-color: #0f1115;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #232835;
            margin-bottom: 30px;
        }
        .reel {
            width: 110px;
            height: 110px;
            background-color: #1a1d26;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            border: 1px solid #2d3345;
            overflow: hidden;
        }
        .reel img {
            width: 80%;
            height: 80%;
            object-fit: contain;
        }
        .spinning {
            animation: cleanSpin 0.1s infinite linear;
        }
        @keyframes cleanSpin {
            0% { filter: blur(1px); transform: translateY(-2px); }
            100% { filter: blur(3px); transform: translateY(2px); }
        }
        .controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .input-group {
            display: flex;
            align-items: center;
            background-color: #0f1115;
            border: 1px solid #232835;
            border-radius: 6px;
            padding: 5px 10px;
        }
        .input-group label {
            color: #6c727a;
            font-size: 0.9rem;
            margin-right: 5px;
            text-transform: uppercase;
            font-weight: 600;
        }
        input[type="number"] {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 1.2rem;
            font-weight: 700;
            width: 90px;
            text-align: center;
            outline: none;
        }
        button {
            background-color: #d4af37;
            color: #0f1115;
            border: none;
            padding: 14px 35px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        button:hover { background-color: #f3c63f; }
        button:active { transform: scale(0.98); }
        button:disabled {
            background-color: #2c303b;
            color: #5c626e;
            cursor: not-allowed;
        }
        .status-message {
            margin-top: 25px;
            font-size: 1.2rem;
            height: 30px;
            font-weight: 600;
            text-align: center;
        }
        .win { color: #2ecc71; }
        .lose { color: #e74c3c; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="navbar-left">
            <div class="navbar-logo">Burmalda</div>
            <ul class="navbar-menu">
                <li class="navbar-item"><a href="/main_page">Главная</a></li>
                <li class="navbar-item"><a href="/upgrader/">Апгрейдер Зачёт</a></li>
                <li class="navbar-item"><a href="/raketka">Ракетка</a></li>
                <li class="navbar-item"><a href="/case_battle">Кейс Баттл</a></li>
                <li class="navbar-item"><a href="/slots" class="active">Слоты</a></li>
                <li class="navbar-item"><a href="/vorona combat">Тапалка</a></li>
            </ul>
        </div>
        <div class="navbar-balance">
            Баланс: <span id="balance-display">{{ balance }}</span> монет
        </div>
    </nav>

    <div class="game-container">
        <div class="slot-machine">
            <div class="reels-container">
                <div id="reel1" class="reel">🍒</div>
                <div id="reel2" class="reel">🍋</div>
                <div id="reel3" class="reel">🍉</div>
            </div>

            <div class="controls">
                <div class="input-group">
                    <label for="bet-input">Ставка</label>
                    <input type="number" id="bet-input" value="100" min="10">
                </div>
                <button id="spin-btn" onclick="playSlots()">КРУТИТЬ</button>
            </div>
        </div>

        <div id="status" class="status-message"></div>
    </div>

    <script src="/static/slots.js"></script>
</body>
</html>
