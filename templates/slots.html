<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>🎰 BURMALDA SLOTS 🎰</title>
    <style>
        body {
            background: radial-gradient(circle, #1a0033 0%, #000000 100%);
            color: #fff;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            font-size: 3rem;
            text-shadow: 0 0 10px #ff007f, 0 0 20px #ff007f;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .balance-container {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
        }

        /* Игровой автомат */
        .slot-machine {
            background: linear-gradient(145deg, #2a2a2a, #111111);
            border: 5px solid #ff007f;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 0 30px #ff007f, inset 0 0 15px #000;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Барабаны */
        .reels-container {
            display: flex;
            gap: 15px;
            background: #000;
            padding: 20px;
            border-radius: 10px;
            border: 3px solid #00ffff;
            box-shadow: inset 0 0 20px rgba(0, 255, 255, 0.5);
            margin-bottom: 25px;
        }

        .reel {
            width: 100px;
            height: 100px;
            background: #111;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            transition: transform 0.1s ease-in-out;
            border: 1px solid #333;
        }

        /* Спец-класс для анимации тряски во время кручения */
        .spinning {
            animation: blurSpin 0.1s infinite alternate;
        }

        @keyframes blurSpin {
            0% { transform: translateY(-5px); filter: blur(2px); }
            100% { transform: translateY(5px); filter: blur(4px); }
        }

        /* Управление */
        .controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        input[type="number"] {
            background: #222;
            border: 2px solid #00ffff;
            border-radius: 5px;
            color: #fff;
            padding: 10px;
            font-size: 1.2rem;
            width: 100px;
            text-align: center;
            outline: none;
        }

        button {
            background: linear-gradient(135deg, #ff007f, #7f00ff);
            border: none;
            color: white;
            padding: 12px 30px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 0 15px #ff007f;
            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px #ff007f, 0 0 10px #7f00ff;
        }

        button:disabled {
            background: #555;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        /* Окно статуса выигрыша */
        .status-message {
            margin-top: 20px;
            font-size: 1.5rem;
            height: 35px;
            font-weight: bold;
            text-align: center;
        }
        .win { color: #00ff00; text-shadow: 0 0 10px #00ff00; }
        .lose { color: #ff3333; text-shadow: 0 0 10px #ff3333; }
    </style>
</head>
<body>

    <h1>BURMALDA SLOTS</h1>
    
    <div class="balance-container">
        Баланс: <span id="balance-display">{{ balance }}</span> монет
    </div>

    <div class="slot-machine">
        <div class="reels-container">
            <div id="reel1" class="reel">🍒</div>
            <div id="reel2" class="reel">🍋</div>
            <div id="reel3" class="reel">🍉</div>
        </div>

        <div class="controls">
            <label for="bet-input">Ставка:</label>
            <input type="number" id="bet-input" value="100" min="10">
            <button id="spin-btn" onclick="playSlots()">КРУТИТЬ</button>
        </div>
    </div>

    <div id="status" class="status-message"></div>

    <script>
        const symbols = ['🍒', '🍋', '🍉', '⭐', '💎'];
        
        // Аудио-эффекты с помощью Web Audio API (без внешних файлов)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type, duration) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        async function playSlots() {
            const spinBtn = document.getElementById('spin-btn');
            const betInput = document.getElementById('bet-input');
            const statusDiv = document.getElementById('status');
            const balanceDisplay = document.getElementById('balance-display');
            
            const bet = parseInt(betInput.value);
            statusDiv.innerHTML = '';
            
            // Включаем анимацию кручения (размытие и тряска)
            const reels = [document.getElementById('reel1'), document.getElementById('reel2'), document.getElementById('reel3')];
            reels.forEach(r => r.classList.add('spinning'));
            spinBtn.disabled = true;

            // Имитируем звук вращения барабанов
            let interval = setInterval(() => {
                reels.forEach(r => r.innerText = symbols[Math.floor(Math.random() * symbols.length)]);
                playTone(150, 'sawtooth', 0.05);
            }, 70);

            try {
                // Отправляем запрос на наш бэкенд во Flask
                const response = await fetch('/slots/spin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ bet: bet })
                });

                const data = await response.json();

                // Останавливаем фейковое кручение через 1.5 секунды, чтобы создать интригу
                setTimeout(() => {
                    clearInterval(interval);
                    reels.forEach(r => r.classList.remove('spinning'));
                    
                    if (response.ok) {
                        // Выводим реальный результат от бэкенда
                        reels[0].innerText = data.reels[0];
                        reels[1].innerText = data.reels[1];
                        reels[2].innerText = data.reels[2];
                        
                        // Обновляем баланс на экране
                        balanceDisplay.innerText = data.balance;

                        if (data.is_win) {
                            statusDiv.className = 'status-message win';
                            statusDiv.innerText = `ВЫИГРЫШ: +${data.win_amount} монет! 🎉`;
                            // Звук победы
                            playTone(440, 'triangle', 0.1);
                            setTimeout(() => playTone(554, 'triangle', 0.1), 100);
                            setTimeout(() => playTone(659, 'triangle', 0.3), 200);
                        } else {
                            statusDiv.className = 'status-message lose';
                            statusDiv.innerText = 'Повезет в следующий раз! 🙃';
                            playTone(200, 'sawtooth', 0.4);
                        }
                    } else {
                        // Ошибка (например, не хватило денег)
                        statusDiv.className = 'status-message lose';
                        statusDiv.innerText = data.error || 'Ошибка запроса';
                        reels.forEach((r, i) => r.innerText = symbols[i]);
                    }
                    spinBtn.disabled = false;
                }, 1500);

            } catch (err) {
                clearInterval(interval);
                reels.forEach(r => r.classList.remove('spinning'));
                statusDiv.innerText = 'Сервер не отвечает';
                spinBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
